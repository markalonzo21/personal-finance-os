name: Release APK to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::Missing RCLONE_CONF secret."
            exit 1
          fi
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "::error::Missing GDRIVE_FOLDER_ID secret."
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Run unit tests and build signed release APK
        env:
          FINANCEOS_STORE_PASSWORD: ${{ secrets.FINANCEOS_STORE_PASSWORD }}
          FINANCEOS_KEY_ALIAS: ${{ secrets.FINANCEOS_KEY_ALIAS }}
          FINANCEOS_KEY_PASSWORD: ${{ secrets.FINANCEOS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare versioned APK filename
        id: apk
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="Omni-v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          APK_PATH="${RUNNER_TEMP}/${APK_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "${APK_PATH}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Upload versioned APK to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          printf '%s\n' "$RCLONE_CONF" > "${RUNNER_TEMP}/rclone.conf"
          rclone copy "${APK_PATH}" "gdrive:" \
            --config "${RUNNER_TEMP}/rclone.conf" \
            --drive-root-folder-id "${GDRIVE_FOLDER_ID}" \
            --verbose

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Clean up temporary secret files
        if: always()
        run: |
          rm -f app/release.jks "${RUNNER_TEMP}/rclone.conf"
